# MineAI-specific workflow (namespaced "talos-" so an upstream-added workflow
# can never collide at sync time).
name: talos-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches the deploy target (Ubuntu 24.04 system python3) and the
          # upstream Dockerfile (python:3.12-slim).
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck deploy/install.sh
      - run: bash -n deploy/install.sh
