# MineAI-specific workflow (namespaced "talos-" so an upstream-added workflow
# can never collide at sync time).
name: talos-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # Matches the deploy target (Ubuntu 24.04 system python3) and the
          # upstream Dockerfile (python:3.12-slim).
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck deploy/*.sh deploy/scripts/*.sh deploy/tests/*.sh
      - run: bash -n deploy/*.sh deploy/scripts/*.sh deploy/tests/*.sh
      # Guards below use `if grep …; then exit 1; fi`, never `! grep`: under
      # bash -e a `!` command that is not the last line can't fail the step.
      - name: Config render test
        # Exercises the exact script deploys use, so a template variable
        # missing from render-config.sh's allowlist fails here: unquoted
        # leftovers break json.tool, quoted ones trip the grep.
        run: |
          export ARK_HOST=127.0.0.1 ARK_PORT=7777 ARK_AUTH_SECRET=dummy \
                 OPENAI_API_KEY=dummy OPENROUTER_API_KEY=dummy \
                 MINEAI_GATEWAY_URL=http://localhost:1 \
                 MINEAI_GATEWAY_SECRET=dummy
          deploy/render-config.sh deploy/config/config.json.tmpl > /tmp/rendered.json
          python3 -m json.tool /tmp/rendered.json > /dev/null
          # shellcheck disable=SC2016 # a literal ${ is the thing searched for
          if grep -qF '${' /tmp/rendered.json; then
            echo "::error::unrendered \${...} left in config.json"; exit 1
          fi
      - name: User-data render test
        # Same drift guard for the cloud-init template: renders through the
        # exact script provision.sh uses, must stay valid YAML, and only
        # the three allowlisted variables may be substituted (every other
        # $ is shell syntax inside runcmd).
        run: |
          export DOMAIN=harness-test.example.com VOLUME_NAME=harness-test-data \
                 DEPLOY_PUBKEY='ssh-ed25519 AAAA_dummy harness-test-deploy'
          deploy/scripts/render-user-data.sh deploy/cloud-init/user-data.tmpl.yml > /tmp/user-data.yml
          pip install --quiet pyyaml
          python3 -c 'import yaml; yaml.safe_load(open("/tmp/user-data.yml"))'
          if grep -qE '\$\{(DOMAIN|VOLUME_NAME|DEPLOY_PUBKEY)\}' /tmp/user-data.yml; then
            echo "::error::unrendered allowlisted variable left in user-data"; exit 1
          fi
          head -1 /tmp/user-data.yml | grep -qx '#cloud-config'
          # Non-ASCII in user-data gets mangled to C1 control chars on the
          # DO metadata path, making cloud-init discard the whole config.
          if LC_ALL=C grep -q '[^ -~]' /tmp/user-data.yml; then
            echo "::error::non-ASCII in user-data"; exit 1
          fi
      - name: provision.sh tests
        # doctl/gh/ssh/… are stubbed first on PATH and log every call: dry
        # runs must call nothing, hostile input must be refused, and the
        # printed pairing block must never pair one side only.
        run: deploy/tests/test-provision.sh
      - name: talos-deploy structure
        # needs/secrets/fail-fast/matrix names: what actionlint can't see.
        run: |
          pip install --quiet pyyaml
          python3 deploy/tests/check-talos-deploy.py
      - name: actionlint
        # Pinned release, verified by checksum. Lints every workflow,
        # including the reusable-workflow call contract, and shellchecks
        # each run: block (shellcheck is preinstalled on the runner).
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
