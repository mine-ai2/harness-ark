# MineAI-specific workflow (namespaced "talos-" so an upstream-added workflow
# can never collide at sync time).
#
# Automated deploys (mine-capstone#470): every push to main deploys the
# `development` environment; `production` runs the same steps but waits for
# required-reviewer approval (configured in repo settings → Environments) and
# only ever deploys a commit whose dev deploy already passed the health gate.
# Each environment carries its own secrets (ANTHROPIC_API_KEY,
# ARK_AUTH_SECRET, MINEAI_GATEWAY_URL, MINEAI_GATEWAY_SECRET,
# SSH_PRIVATE_KEY) and variables (DEPLOY_HOST, DEPLOY_USER, DEPLOY_DOMAIN,
# SSH_KNOWN_HOSTS).
# Remote-side logic lives in deploy/deploy-remote.sh, which ships with the
# rsync so runner and remote can never version-skew.
name: talos-deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # manual re-deploy of main, e.g. after secret rotation

permissions:
  contents: read

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    concurrency:
      group: deploy-development
      cancel-in-progress: false # never kill a mid-flight rsync/restart
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/id"
          chmod 600 "$RUNNER_TEMP/ssh/id"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          echo "SSH_OPTS=-i $RUNNER_TEMP/ssh/id -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"

      - name: Rsync code to /opt/harness-ark
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        # --exclude .venv is load-bearing: the venv lives inside the code dir
        # and ExecStart points at it; excluded paths are also protected from
        # --delete. --chown=root:root keeps code root-owned so the ark user
        # cannot self-modify the server.
        run: |
          rsync -az --delete --chown=root:root \
            --exclude '.git' --exclude '.venv' \
            --exclude '__pycache__' --exclude '.pytest_cache' \
            --rsync-path='sudo rsync' \
            -e "ssh $SSH_OPTS" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/opt/harness-ark/"

      - name: Run remote deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          ARK_AUTH_SECRET: ${{ secrets.ARK_AUTH_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MINEAI_GATEWAY_URL: ${{ secrets.MINEAI_GATEWAY_URL }}
          MINEAI_GATEWAY_SECRET: ${{ secrets.MINEAI_GATEWAY_SECRET }}
        # Secrets travel over stdin: never argv (visible in `ps` on the VM),
        # never a file that outlives the deploy. ssh propagates the remote
        # exit status, so any deploy-remote.sh failure fails this step red.
        run: |
          umask 077
          {
            printf '%s=%s\n' ARK_AUTH_SECRET "$ARK_AUTH_SECRET"
            printf '%s=%s\n' ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"
            printf '%s=%s\n' MINEAI_GATEWAY_URL "$MINEAI_GATEWAY_URL"
            printf '%s=%s\n' MINEAI_GATEWAY_SECRET "$MINEAI_GATEWAY_SECRET"
          } > "$RUNNER_TEMP/deploy.env"
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo /opt/harness-ark/deploy/deploy-remote.sh' \
            < "$RUNNER_TEMP/deploy.env"
          rm -f "$RUNNER_TEMP/deploy.env"

      - name: External smoke test
        env:
          ARK_AUTH_SECRET: ${{ secrets.ARK_AUTH_SECRET }}
          DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
        # Exercises DNS + Caddy TLS + the WebSocket proxy path from the
        # runner — the loopback health gate in deploy-remote.sh cannot.
        run: |
          pip install --quiet 'websockets>=13.0'
          deploy/scripts/smoke.sh "$DEPLOY_DOMAIN"

  # Same steps as deploy-dev (GitHub Actions has no YAML anchors; keep the
  # two jobs textually in sync), resolving secrets/vars from the production
  # environment instead.
  deploy-prod:
    needs: deploy-dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/id"
          chmod 600 "$RUNNER_TEMP/ssh/id"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          echo "SSH_OPTS=-i $RUNNER_TEMP/ssh/id -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"

      - name: Rsync code to /opt/harness-ark
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          rsync -az --delete --chown=root:root \
            --exclude '.git' --exclude '.venv' \
            --exclude '__pycache__' --exclude '.pytest_cache' \
            --rsync-path='sudo rsync' \
            -e "ssh $SSH_OPTS" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/opt/harness-ark/"

      - name: Run remote deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          ARK_AUTH_SECRET: ${{ secrets.ARK_AUTH_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MINEAI_GATEWAY_URL: ${{ secrets.MINEAI_GATEWAY_URL }}
          MINEAI_GATEWAY_SECRET: ${{ secrets.MINEAI_GATEWAY_SECRET }}
        run: |
          umask 077
          {
            printf '%s=%s\n' ARK_AUTH_SECRET "$ARK_AUTH_SECRET"
            printf '%s=%s\n' ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"
            printf '%s=%s\n' MINEAI_GATEWAY_URL "$MINEAI_GATEWAY_URL"
            printf '%s=%s\n' MINEAI_GATEWAY_SECRET "$MINEAI_GATEWAY_SECRET"
          } > "$RUNNER_TEMP/deploy.env"
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo /opt/harness-ark/deploy/deploy-remote.sh' \
            < "$RUNNER_TEMP/deploy.env"
          rm -f "$RUNNER_TEMP/deploy.env"

      - name: External smoke test
        env:
          ARK_AUTH_SECRET: ${{ secrets.ARK_AUTH_SECRET }}
          DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
        run: |
          pip install --quiet 'websockets>=13.0'
          deploy/scripts/smoke.sh "$DEPLOY_DOMAIN"
