# MineAI-specific workflow (namespaced "talos-" so an upstream-added workflow
# can never collide at sync time).
#
# Automated deploys (mine-capstone#470, #1085): every push to main deploys the
# `development` environment; then every production environment in the
# deploy-prod matrix (`production`, plus one `production-<c>` per customer
# harness) runs the same steps, each leg waiting for its OWN environment's
# required-reviewer approval (repo settings → Environments) and only ever
# deploying a commit whose dev deploy already passed the health gate. The
# steps live once, in talos-deploy-env.yml.
#
# Each environment carries its own secrets (SSH_PRIVATE_KEY,
# ARK_AUTH_SECRET, OPENAI_API_KEY, OPENROUTER_API_KEY, MINEAI_GATEWAY_URL,
# MINEAI_GATEWAY_SECRET) and variables (DEPLOY_HOST, DEPLOY_USER,
# DEPLOY_DOMAIN, SSH_KNOWN_HOSTS); deploy/scripts/provision.sh prints the
# commands that set them.
# Remote-side logic lives in deploy/deploy-remote.sh, which ships with the
# rsync so runner and remote can never version-skew.
name: talos-deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # manual re-deploy of main, e.g. after secret rotation

permissions:
  contents: read

jobs:
  deploy-dev:
    uses: ./.github/workflows/talos-deploy-env.yml
    with:
      environment: development
    secrets: inherit

  deploy-prod:
    needs: deploy-dev
    strategy:
      # One leg's failure (or a rejected approval) never cancels another
      # customer's deploy.
      fail-fast: false
      matrix:
        # One leg per production harness. Add `production-<c>` here to
        # onboard a customer (mine-capstone#1086), but ONLY once that
        # environment already exists with its required reviewer and
        # deployment branch policy `main` (run the protection commands that
        # `deploy/scripts/provision.sh <c>` prints first). A name listed here
        # before its environment exists makes GitHub auto-create it
        # UNPROTECTED on the next run: no reviewer, any branch. Remove the
        # entry before tearing that harness down.
        environment: [production]
    uses: ./.github/workflows/talos-deploy-env.yml
    with:
      environment: ${{ matrix.environment }}
    secrets: inherit
